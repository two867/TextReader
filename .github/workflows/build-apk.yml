name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for clarity
        run: |
          mkdir -p output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output/TextReader-release.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextReader-APK
          path: output/TextReader-release.apk
          retention-days: 30

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/TextReader-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
